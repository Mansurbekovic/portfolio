services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antigravity-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=antigravity_super_secret_key_production_grade
      - ALLOWED_ORIGINS=["http://localhost:5173", "http://localhost:80", "http://localhost"]
      - CSP_ENABLED=True
      - HSTS_ENABLED=True
    networks:
      - antigravity-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antigravity-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - antigravity-net
    restart: unless-stopped

networks:
  antigravity-net:
    driver: bridge
