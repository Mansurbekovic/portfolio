services:
  - type: web
    name: antigravity-portfolio-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: HSTS_ENABLED
        value: "true"
      - key: CSP_ENABLED
        value: "true"
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: TELEGRAM_BOT_TOKEN
        value: "8998536495:AAFjX6H191oD0p9PMyAVQKX3UV7CkPRjoSw"
      - key: TELEGRAM_CHAT_ID
        value: "8452066082"
      - key: GEMINI_API_KEY
        value: ""
      - key: ANTHROPIC_API_KEY
        value: ""
